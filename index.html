<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Test - VMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; padding: 20px; text-align: center; }
    #video, #canvas { width: 100%; max-width: 320px; height: 240px; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <div class="container my-4">
    <h4 class="mb-3">Webcam Test Page</h4>
    
    <div class="d-flex justify-content-center gap-3 mb-3">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" class="d-none"></canvas>
    </div>

    <div class="mb-3">
      <button class="btn btn-primary me-2" onclick="startCamera()">Start Camera</button>
      <button class="btn btn-success me-2" onclick="takePhoto()">Capture Photo</button>
      <button class="btn btn-danger" onclick="stopCamera()">Stop Camera</button>
    </div>

    <div id="status" class="alert alert-info d-inline-block px-4">Camera ready...</div>
  </div>

  <script>
    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('video').srcObject = stream;
        document.getElementById('status').innerText = "Camera Active!";
        document.getElementById('status').className = "alert alert-success d-inline-block px-4";
      } catch (err) {
        document.getElementById('status').innerText = "Camera Error: " + err.message;
        document.getElementById('status').className = "alert alert-danger d-inline-block px-4";
      }
    }

    function takePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      if (!stream) {
        alert("आधी कॅमेरा चालू करा!");
        return;
      }
      const context = canvas.getContext('2d');
      canvas.width = 320;
      canvas.height = 240;
      context.drawImage(video, 0, 0, 320, 240);
      canvas.classList.remove('d-none');
      document.getElementById('status').innerText = "Photo Captured!";
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('video').srcObject = null;
        document.getElementById('status').innerText = "Camera Stopped.";
        document.getElementById('status').className = "alert alert-warning d-inline-block px-4";
      }
    }
  </script>
</body>
</html>
