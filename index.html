<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Test - VMS</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f8f9fa;
      padding: 20px;
      text-align: center;
    }

    #video,
    #canvas {
      width: 100%;
      max-width: 320px;
      height: 240px;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <div class="container my-4">

    <h4 class="mb-3">Webcam Test Page</h4>

    <div class="d-flex justify-content-center gap-3 mb-3">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <canvas
        id="canvas"
        class="d-none">
      </canvas>

    </div>

    <div class="mb-3">

      <button
        class="btn btn-primary me-2"
        onclick="startCamera()">
        Start Camera
      </button>

      <button
        class="btn btn-success me-2"
        onclick="takePhoto()">
        Capture Photo
      </button>

      <button
        class="btn btn-danger"
        onclick="stopCamera()">
        Stop Camera
      </button>

    </div>

    <div
      id="status"
      class="alert alert-info d-inline-block px-4">
      Camera ready...
    </div>

  </div>


  <script>

    let stream = null;


    // ==========================================
    // START CAMERA
    // ==========================================

    async function startCamera() {

      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Camera API is not supported by this browser."
          );

        }


        // Stop previous camera stream
        stopCamera(false);


        stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              width: {
                ideal: 640
              },
              height: {
                ideal: 480
              },
              facingMode: "user"
            },
            audio: false
          });


        const video =
          document.getElementById("video");


        video.srcObject = stream;

        await video.play();


        setStatus(
          "Camera Active!",
          "success"
        );

      }

      catch (err) {

        console.error(
          "Camera Error:",
          err
        );


        setStatus(
          "Camera Error: " + err.message,
          "danger"
        );

      }

    }


    // ==========================================
    // CAPTURE PHOTO
    // ==========================================

    function takePhoto() {

      const video =
        document.getElementById("video");

      const canvas =
        document.getElementById("canvas");


      // Check camera
      if (!stream) {

        alert(
          "आधी कॅमेरा चालू करा!"
        );

        return;

      }


      // Check video readiness
      if (video.readyState < 2) {

        alert(
          "कॅमेरा अजून तयार झालेला नाही. कृपया थोडा वेळ थांबा."
        );

        return;

      }


      const width =
        video.videoWidth || 640;

      const height =
        video.videoHeight || 480;


      canvas.width = width;
      canvas.height = height;


      const context =
        canvas.getContext("2d");


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      // Convert captured photo to JPEG data URL
      const imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.85
        );


      // ==========================================
      // SEND PHOTO BACK TO DASHBOARD
      // ==========================================

      if (
        window.opener &&
        !window.opener.closed
      ) {

        // Stop webcam before returning
        stopCamera(false);


        // Send photo to Dashboard
        window.opener.postMessage(
          {
            type: "VISITOR_PHOTO",
            image: imageData
          },
          "*"
        );


        setStatus(
          "Photo Captured! Returning to Dashboard...",
          "success"
        );


        // Close this camera popup
        setTimeout(
          function() {
            window.close();
          },
          500
        );

      }

      else {

        setStatus(
          "Dashboard window not found.",
          "danger"
        );

      }

    }


    // ==========================================
    // STOP CAMERA
    // ==========================================

    function stopCamera(
      showMessage = true
    ) {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

        stream = null;

      }


      const video =
        document.getElementById("video");


      if (video) {

        video.srcObject = null;

      }


      if (showMessage) {

        setStatus(
          "Camera Stopped.",
          "warning"
        );

      }

    }


    // ==========================================
    // STATUS MESSAGE
    // ==========================================

    function setStatus(
      message,
      type
    ) {

      const status =
        document.getElementById("status");


      status.innerText =
        message;


      status.className =
        "alert alert-" +
        type +
        " d-inline-block px-4";

    }


    // ==========================================
    // AUTO START CAMERA
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        setTimeout(
          function() {
            startCamera();
          },
          300
        );

      }
    );

  </script>

</body>
</html>
