<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Visitor Camera Test</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family: Arial, sans-serif;

  background: #f5f5f5;

  text-align: center;

}

h1 {

  margin-bottom: 20px;

}

#cameraBox {

  width: 100%;

  max-width: 650px;

  margin: auto;

  background: #000;

  border-radius: 12px;

  overflow: hidden;

}

#video {

  width: 100%;

  display: block;

}

#preview {

  width: 100%;

  display: none;

}

#canvas {

  display: none;

}

button {

  width: 100%;

  max-width: 650px;

  padding: 16px;

  margin-top: 15px;

  border: none;

  border-radius: 8px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

#startBtn {

  background: #1976d2;

  color: white;

}

#captureBtn {

  background: #2e7d32;

  color: white;

  display: none;

}

#retakeBtn {

  background: #616161;

  color: white;

  display: none;

}

#sendBtn {

  background: #ef6c00;

  color: white;

  display: none;

}

#status {

  max-width: 650px;

  margin: 20px auto;

  padding: 15px;

  background: white;

  border-radius: 8px;

  font-weight: bold;

}

.success {

  color: #2e7d32;

}

.error {

  color: #c62828;

}

.info {

  color: #1565c0;

}

</style>

</head>


<body>


<h1>📷 Visitor Camera Test</h1>


<div id="cameraBox">

<video
  id="video"
  autoplay
  playsinline
  muted>
</video>

<img
  id="preview"
  alt="Captured Photo">

</div>


<canvas id="canvas"></canvas>


<button
  id="startBtn"
  onclick="startCamera()">

📷 START CAMERA

</button>


<button
  id="captureBtn"
  onclick="capturePhoto()">

📸 CAPTURE PHOTO

</button>


<button
  id="retakeBtn"
  onclick="retakePhoto()">

🔄 RETAKE PHOTO

</button>


<button
  id="sendBtn"
  onclick="sendPhoto()">

✅ SEND PHOTO

</button>


<div
  id="status"
  class="info">

START CAMERA क्लिक करा.

</div>


<script>


let stream = null;

let imageData = null;


const video =
  document.getElementById("video");

const preview =
  document.getElementById("preview");

const canvas =
  document.getElementById("canvas");

const status =
  document.getElementById("status");


function setStatus(
  message,
  type
) {

  status.innerHTML = message;

  status.className =
    type || "info";

}


// ======================================================
// START CAMERA
// ======================================================

async function startCamera() {

  setStatus(
    "⏳ Camera permission मागत आहे...",
    "info"
  );


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera API उपलब्ध नाही."
      );

    }


    stopCamera();


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    document.getElementById(
      "startBtn"
    ).style.display = "none";


    document.getElementById(
      "captureBtn"
    ).style.display = "block";


    setStatus(
      "✅ CAMERA STARTED!<br><br>" +
      "आता CAPTURE PHOTO क्लिक करा.",
      "success"
    );

  }


  catch (error) {

    console.error(error);


    let msg =
      "❌ CAMERA ERROR<br><br>";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      msg +=
        "Camera permission denied आहे.";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      msg +=
        "Camera सापडला नाही.";

    }

    else {

      msg +=
        error.name +
        "<br>" +
        error.message;

    }


    setStatus(
      msg,
      "error"
    );

  }

}


// ======================================================
// CAPTURE
// ======================================================

function capturePhoto() {


  if (!stream) {

    return;

  }


  const width =
    video.videoWidth || 1280;


  const height =
    video.videoHeight || 720;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    video,

    0,

    0,

    width,

    height

  );


  imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.75
    );


  preview.src =
    imageData;


  preview.style.display =
    "block";


  video.style.display =
    "none";


  stopCamera();


  document.getElementById(
    "captureBtn"
  ).style.display =
    "none";


  document.getElementById(
    "retakeBtn"
  ).style.display =
    "block";


  document.getElementById(
    "sendBtn"
  ).style.display =
    "block";


  setStatus(
    "✅ PHOTO CAPTURED!",
    "success"
  );

}


// ======================================================
// RETAKE
// ======================================================

function retakePhoto() {

  imageData = null;


  preview.src = "";

  preview.style.display =
    "none";


  video.style.display =
    "block";


  document.getElementById(
    "retakeBtn"
  ).style.display =
    "none";


  document.getElementById(
    "sendBtn"
  ).style.display =
    "none";


  document.getElementById(
    "startBtn"
  ).style.display =
    "block";


  setStatus(
    "START CAMERA क्लिक करा.",
    "info"
  );

}


// ======================================================
// SEND TO APPS SCRIPT
// ======================================================

function sendPhoto() {


  if (!imageData) {

    return;

  }


  if (!window.opener) {

    setStatus(

      "❌ हा camera page मुख्य Apps Script window मधून उघडलेला नाही.",

      "error"

    );

    return;

  }


  window.opener.postMessage(

    {

      type:
        "VISITOR_PHOTO",

      image:
        imageData

    },

    "*"

  );


  setStatus(

    "✅ PHOTO SENT!<br><br>" +
    "Window बंद होत आहे...",

    "success"

  );


  setTimeout(

    function() {

      window.close();

    },

    1000

  );

}


// ======================================================
// STOP CAMERA
// ======================================================

function stopCamera() {

  if (stream) {

    stream
    .getTracks()
    .forEach(

      function(track) {

        track.stop();

      }

    );

    stream = null;

  }

}


window.addEventListener(

  "beforeunload",

  function() {

    stopCamera();

  }

);

</script>


</body>

</html>
